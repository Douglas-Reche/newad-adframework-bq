# é legado desabilitado". backend.md, hub-frontend.md e o CLAUDE.md raiz referenciam
# este arquivo em vez de manter cópia própria da lista — nunca duplicar aqui.
#
# Auditado ao vivo contra o BigQuery em 2026-08-03 (dataset core, INFORMATION_SCHEMA.TABLES).
# Correção pontual em 2026-08-08 (Frente A, item A3): client_reporting_source_config/
# resolve_reporting_source corrigidos para staging_only e schema_change_log adicionado --
# confirmados via código (hub/app.py, core/ddl/, apply_ddl.py, CHANGELOG.md), não via nova
# consulta INFORMATION_SCHEMA (sessão sem acesso ao BigQuery ao vivo -- ver nota sobre
# _resolve_test_simple abaixo). Não invalida a auditoria de 2026-08-03 quanto ao resto.
# owner: "pipeline" | "shiro_admin_ui" | "legacy_disabled"

