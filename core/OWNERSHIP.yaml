  - name: _resolve_test_simple
    dataset: core
    owner: pipeline
    type: function
    status: "orphan_confirmed_unused"
    notes: "CONFIRMADO ao vivo em 2026-08-09 (core.INFORMATION_SCHEMA.ROUTINES) -- existe SO em `adframework` (producao); ausente em `douglas-bq-staging.core.INFORMATION_SCHEMA.ROUTINES` (que tem as outras 3: resolve_dict_format, resolve_dict_format_fallback, resolve_platform_rule, + resolve_reporting_source staging_only). DDL: `CREATE FUNCTION adframework.core._resolve_test_simple(p_platform STRING) RETURNS STRING AS ((SELECT ANY_VALUE(goal_type) FROM adframework.core.dict_format WHERE platform = p_platform))`. Nao segue o contrato SCD2 das outras 3 resolve_* (sem parametro as_of_date, sem filtro de vigencia effective_from/effective_to, sem filtro por formato -- so por platform). Sem DDL commitado em raw/ddl, stg/ddl, core/ddl ou gold/ddl (grep no repo inteiro, zero ocorrencias). Confirmado SEM CONSUMIDOR: nenhuma view de core/gold referencia (INFORMATION_SCHEMA.VIEWS.view_definition LIKE '%_resolve_test_simple%' -- zero linhas nos dois datasets). Recomendacao (nao executada nesta sessao -- decisao de produto do Douglas): DROP FUNCTION, por ser artefato de teste orfao em producao, sem uso e sem DDL versionado -- mesmo padrao de objeto 'shadow' identificado em dict_format (ver known_issues.md V1)."

