    owner: pipeline
    notes: "Override historico Cora, escopo fechado Jan-Jul/2026 -- ver hub/README.md"
  - name: change_proposals
    dataset: core
    owner: pipeline
    notes: "Fila generica de propostas de mudanca (detectar->propor->aprovar->aplicar). Primeira consumidora: Siprocal."
