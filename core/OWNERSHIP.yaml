  - name: resolve_reporting_source
    dataset: core
    owner: pipeline
    type: function
    status: "staging_only"
    notes: "Criada 2026-08-05 junto com client_reporting_source_config -- generaliza o hardcode de gold.vw_fact_delivery_reporting. NAO existe em `adframework` (producao) -- so em `douglas-bq-staging`. Mesma confirmacao de client_reporting_source_config acima."
  - name: schema_change_log
    dataset: core
    owner: pipeline
    notes: "Log de auditoria de toda execucao do scripts/deploy/apply_ddl.py (test OU prod) -- grava change_id/object_dataset/object_name/tested_env/tested_at/status + previous_definition/commit_hash (para --rollback). Existe em producao (`adframework.core.schema_change_log`, hardcoded em core/ddl/schema_change_log.sql e usado por todo apply_ddl.py). Faltava neste YAML -- adicionado 2026-08-08."

